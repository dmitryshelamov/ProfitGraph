name: profitgraph

services:
  postgres:
    image: postgres:17-alpine
    container_name: profitgraph-postgres-dev
    environment:
      POSTGRES_DB: profitgraph_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - profitgraph_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d profitgraph_dev" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  profitgraph_postgres_dev_data:
