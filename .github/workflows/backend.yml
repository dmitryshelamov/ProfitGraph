name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'global.json'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'global.json'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_ENVIRONMENT: Testing
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5436:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore backend/ProfitGraph.sln
      - name: Build with warnings as errors
        run: dotnet build backend/ProfitGraph.sln --configuration Release --no-restore -warnaserror
      - name: Unit and architecture tests
        run: >-
          dotnet test backend/tests/ProfitGraph.Tests.Unit/ProfitGraph.Tests.Unit.csproj
          --configuration Release --no-build
      - name: Integration tests
        env:
          PROFITGRAPH_TEST_POSTGRES: Host=localhost;Port=5436;Username=postgres;Password=postgres;Database=postgres
        run: >-
          dotnet test backend/tests/ProfitGraph.Tests.Integration/ProfitGraph.Tests.Integration.csproj
          --configuration Release --no-build
